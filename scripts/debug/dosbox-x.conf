# DOSBox-X config for debugging PPAP PC/XT boot
#
# Usage:
#   dosbox-x -conf scripts/debug/dosbox-x.conf
#
# This mounts the HDD image and boots from it with 8086 CPU
# emulation and verbose logging.  The log file captures INT calls
# with the faulting CS:IP.

[dosbox]
machine=svga_s3

[cpu]
cputype=8086
core=normal
cycles=3000

[log]
logfile=dosbox-x-debug.log

[serial]
serial1=file:dosbox-x-serial.log

[autoexec]
imgmount 2 build/pcxt/ppap_pcxt_hdd.img -t hdd -fs none
boot c:
